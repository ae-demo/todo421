openapi: 3.0.3
info:
  title: Todo API
  version: 0.1.0
  description: Manages todo lists, tasks, list collaborators, and in-app notifications.
servers:
  - url: /
security:
  - bearerAuth: []
paths:
  /lists:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      operationId: listLists
      summary: List todo lists the caller owns or collaborates on
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: paginated lists
          content:
            application/json:
              schema:
                type: object
                required: [count, data]
                properties:
                  count: { type: integer, description: total matching lists }
                  next: { type: string, nullable: true, description: relative URI of the next page }
                  previous: { type: string, nullable: true, description: relative URI of the previous page }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/TodoList' }
        '401':
          description: not authenticated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    post:
      operationId: createList
      summary: Create a new todo list owned by the caller
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NewList' }
      responses:
        '201':
          description: list created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TodoList' }
        '400':
          description: invalid list
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: not authenticated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /lists/{listId}:
    parameters:
      - $ref: '#/components/parameters/ListId'
      - $ref: '#/components/parameters/UserId'
    get:
      operationId: getList
      summary: Get a todo list
      responses:
        '200':
          description: the list
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TodoList' }
        '404':
          description: list not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    patch:
      operationId: updateList
      summary: Rename a todo list
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ListUpdate' }
      responses:
        '200':
          description: list updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TodoList' }
        '400':
          description: invalid update
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: list not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    delete:
      operationId: deleteList
      summary: Delete a todo list (owner only)
      responses:
        '204':
          description: list deleted
        '403':
          description: caller is not the owner
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: list not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /lists/{listId}/members:
    parameters:
      - $ref: '#/components/parameters/ListId'
      - $ref: '#/components/parameters/UserId'
    get:
      operationId: listMembers
      summary: List a list's owner and collaborators
      responses:
        '200':
          description: members
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Member' }
        '404':
          description: list not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    post:
      operationId: inviteMember
      summary: Invite a collaborator to the list by email
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Invitation' }
      responses:
        '201':
          description: invitation sent
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Member' }
        '400':
          description: invalid invitation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: caller is not the owner
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: list not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /lists/{listId}/members/{userId}:
    parameters:
      - $ref: '#/components/parameters/ListId'
      - $ref: '#/components/parameters/MemberUserId'
      - $ref: '#/components/parameters/UserId'
    delete:
      operationId: removeMember
      summary: Remove a collaborator, or leave the list as the caller
      responses:
        '204':
          description: member removed
        '403':
          description: caller may not remove this member
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: list or member not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /invitations/{invitationId}/accept:
    parameters:
      - $ref: '#/components/parameters/InvitationId'
      - $ref: '#/components/parameters/UserId'
    post:
      operationId: acceptInvitation
      summary: Accept a pending invitation and join the list as a collaborator
      responses:
        '200':
          description: joined the list
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TodoList' }
        '404':
          description: invitation not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /lists/{listId}/tasks:
    parameters:
      - $ref: '#/components/parameters/ListId'
      - $ref: '#/components/parameters/UserId'
    get:
      operationId: listTasks
      summary: List tasks on a list, filterable and sortable
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - name: priority
          in: query
          schema: { type: string, enum: [low, medium, high] }
          description: filter by priority
        - name: category
          in: query
          schema: { type: string }
          description: filter by category/tag
        - name: assigneeId
          in: query
          schema: { type: string }
          description: filter by assignee
        - name: completed
          in: query
          schema: { type: boolean }
          description: filter by completion status
        - name: sort
          in: query
          schema: { type: string, enum: [dueDate, priority] }
          description: sort field
      responses:
        '200':
          description: paginated tasks
          content:
            application/json:
              schema:
                type: object
                required: [count, data]
                properties:
                  count: { type: integer, description: total matching tasks }
                  next: { type: string, nullable: true, description: relative URI of the next page }
                  previous: { type: string, nullable: true, description: relative URI of the previous page }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Task' }
        '404':
          description: list not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    post:
      operationId: createTask
      summary: Add a task to a list
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NewTask' }
      responses:
        '201':
          description: task created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Task' }
        '400':
          description: invalid task
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: list not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /tasks/{taskId}:
    parameters:
      - $ref: '#/components/parameters/TaskId'
      - $ref: '#/components/parameters/UserId'
    get:
      operationId: getTask
      summary: Get a task
      responses:
        '200':
          description: the task
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Task' }
        '404':
          description: task not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    patch:
      operationId: updateTask
      summary: Update a task's title, due date, priority, categories, assignee, or completion
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaskUpdate' }
      responses:
        '200':
          description: task updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Task' }
        '400':
          description: invalid update
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: task not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    delete:
      operationId: deleteTask
      summary: Delete a task
      responses:
        '204':
          description: task deleted
        '404':
          description: task not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /notifications:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      operationId: listNotifications
      summary: List the caller's in-app notifications
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - name: unreadOnly
          in: query
          schema: { type: boolean }
          description: return only unread notifications
      responses:
        '200':
          description: paginated notifications
          content:
            application/json:
              schema:
                type: object
                required: [count, data]
                properties:
                  count: { type: integer, description: total matching notifications }
                  next: { type: string, nullable: true, description: relative URI of the next page }
                  previous: { type: string, nullable: true, description: relative URI of the previous page }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Notification' }
  /notifications/{notificationId}:
    parameters:
      - $ref: '#/components/parameters/NotificationId'
      - $ref: '#/components/parameters/UserId'
    patch:
      operationId: updateNotification
      summary: Mark a notification as read
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [read]
              properties:
                read: { type: boolean }
      responses:
        '200':
          description: notification updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Notification' }
        '404':
          description: notification not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  parameters:
    UserId:
      name: X-User-Id
      in: header
      required: true
      description: caller identity injected by the gateway from the validated token
      schema: { type: string }
    ListId:
      name: listId
      in: path
      required: true
      schema: { type: string }
      description: the list's id
    MemberUserId:
      name: userId
      in: path
      required: true
      schema: { type: string }
      description: the member's user id
    InvitationId:
      name: invitationId
      in: path
      required: true
      schema: { type: string }
      description: the invitation's id
    TaskId:
      name: taskId
      in: path
      required: true
      schema: { type: string }
      description: the task's id
    NotificationId:
      name: notificationId
      in: path
      required: true
      schema: { type: string }
      description: the notification's id
    Limit:
      name: limit
      in: query
      schema: { type: integer, default: 20, maximum: 100 }
      description: page size
    Offset:
      name: offset
      in: query
      schema: { type: integer, default: 0 }
      description: page offset
  schemas:
    TodoList:
      type: object
      required: [id, name, ownerId]
      properties:
        id: { type: string }
        name: { type: string }
        ownerId: { type: string, description: user id of the owner }
    NewList:
      type: object
      required: [name]
      properties:
        name: { type: string }
    ListUpdate:
      type: object
      properties:
        name: { type: string }
    Member:
      type: object
      required: [userId, email, role]
      properties:
        userId: { type: string }
        email: { type: string }
        role: { type: string, enum: [owner, collaborator, invited] }
    Invitation:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email }
    Task:
      type: object
      required: [id, listId, title, priority, completed]
      properties:
        id: { type: string }
        listId: { type: string }
        title: { type: string }
        dueDate: { type: string, format: date, nullable: true }
        priority: { type: string, enum: [low, medium, high] }
        categories:
          type: array
          items: { type: string }
        assigneeId: { type: string, nullable: true }
        completed: { type: boolean }
    NewTask:
      type: object
      required: [title, priority]
      properties:
        title: { type: string }
        dueDate: { type: string, format: date, nullable: true }
        priority: { type: string, enum: [low, medium, high] }
        categories:
          type: array
          items: { type: string }
        assigneeId: { type: string, nullable: true }
    TaskUpdate:
      type: object
      properties:
        title: { type: string }
        dueDate: { type: string, format: date, nullable: true }
        priority: { type: string, enum: [low, medium, high] }
        categories:
          type: array
          items: { type: string }
        assigneeId: { type: string, nullable: true }
        completed: { type: boolean }
    Notification:
      type: object
      required: [id, type, message, read]
      properties:
        id: { type: string }
        type: { type: string, enum: [invitation, assignment] }
        message: { type: string }
        read: { type: boolean }
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: integer, description: HTTP or application error code }
        message: { type: string, description: short human-readable label }
        description: { type: string, description: detailed explanation }
        moreInfo: { type: string, description: URI to documentation }
